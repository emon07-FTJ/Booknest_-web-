
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest+ | Login</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>BookNest<span>+</span></h1>
        <p>Your world of books</p>
    </header>

    <main class="container">
        <section class="auth-card">

            <div class="tabs">
                <button type="button" id="login-tab" class="tab active">
                    Login
                </button>
                <button type="button" id="register-tab" class="tab">
                    Register
                </button>
            </div>

            <form id="login-form">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to continue reading.</p>

                <label for="login-email">Email Address</label>
                <input type="email" id="login-email"
                       placeholder="Enter your email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password"
                       placeholder="Enter your password"
                       required minlength="6">

                <button type="submit" class="submit-btn">Login</button>
                <p id="login-message" class="message"
                   aria-live="polite"></p>

                <p class="switch-text">
                    New to BookNest+?
                    <button type="button" class="text-btn"
                            id="open-register">
                        Create an account
                    </button>
                </p>
            </form>

            <form id="register-form" hidden>
                <h2>Create Account</h2>
                <p class="subtitle">Join our reading community.</p>

                <label for="register-name">Full Name</label>
                <input type="text" id="register-name"
                       placeholder="Enter your full name"
                       required minlength="2">

                <label for="register-email">Email Address</label>
                <input type="email" id="register-email"
                       placeholder="Enter your email" required>

                <label for="register-password">Password</label>
                <input type="password" id="register-password"
                       placeholder="Create a password (minimum 6 characters)"
                       required minlength="6">

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                       placeholder="Enter the password again"
                       required minlength="6">

                <button type="submit" class="submit-btn">
                    Create Account
                </button>

                <p id="register-message" class="message"
                   aria-live="polite"></p>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" class="text-btn"
                            id="open-login">
                        Login
                    </button>
                </p>
            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 BookNest+. All rights reserved.</p>
    </footer>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config/supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
